# Deploys the game to GitHub Pages.
#
# Pages serves static files and does not run builds, so this workflow builds
# the site (tsc -> dist/, then assemble-dist.js adds index.html, css/, and the
# event JSON) and uploads the finished dist/ as the Pages artifact.
#
# Requires the repo's Pages source to be set to "GitHub Actions"
# (Settings -> Pages -> Build and deployment -> Source -> GitHub Actions).

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only one deployment at a time; don't cancel the run in progress.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    permissions: { contents: read }
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Build (tsc)
        run: npm run build
      - name: Assemble site
        run: npm run assemble
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
